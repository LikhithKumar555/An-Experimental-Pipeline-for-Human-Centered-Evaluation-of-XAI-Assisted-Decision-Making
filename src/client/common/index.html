<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline';">
  <title>Blockies Study</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/common/index.css">

<body>
  <div class="fixed-page-dimension">

        <a href="/" class="home-btn">← Home</a>

        <div class="progress-text" id="progress-bar-text">Diagnosis 0/0</div>

      <div class="main-row1" id="row1-container"></div>
      <div class="main-row2" id="row2-container"></div>

    <footer>
      <div class="nav-buttons">
        <button class="invisible" id="button-prev">Previous</button>
        <button id="button-next">Next</button>
        <!-- Moved inside the div and added a hidden class -->
        <button id="submit-btn" class="submit-bottom hidden">Submit</button>
      </div>
    </footer>
